name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 真宿主测试工件：HostConformanceTests 依赖它 spawn 真宿主
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install test-host artifact
        run: npm install --no-audit --no-fund

      - name: Test
        run: dotnet test Syllm.Brickly.Sdk.sln -c Release --nologo
